name: Release

# Push a v* tag to publish RepoRadar.app as a GitHub Release.
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh release
      # Drag-to-install DMG: the app next to an Applications shortcut.
      - run: |
          mkdir dmg && mv RepoRadar.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname RepoRadar -srcfolder dmg -format UDZO "RepoRadar-$GITHUB_REF_NAME.dmg"
      - run: gh release create "$GITHUB_REF_NAME" "RepoRadar-$GITHUB_REF_NAME.dmg" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
